<aside class="sidebar" [class.sidebar--open]="open()" aria-label="Navegación principal">
  <div class="sidebar__brand">
    <span class="sidebar__logo" aria-hidden="true">A</span>
    <div>
      <strong>AssetFlow</strong>
      <small>Gestión de activos TI</small>
    </div>
  </div>

  <nav class="sidebar__nav">
    <p class="sidebar__section-label">Workspace</p>
    @for (item of items(); track item.route) {
      <a
        class="sidebar__link"
        [routerLink]="item.route"
        routerLinkActive="sidebar__link--active"
        [routerLinkActiveOptions]="{ exact: item.exact ?? false }"
        (click)="closeOnMobile()"
      >
        <af-icon [name]="item.icon" [size]="19" />
        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__footer">
    @if (session.user(); as user) {
      <span class="sidebar__avatar">{{ user.fullName.charAt(0) }}</span>
      <div class="sidebar__user-copy">
        <strong>{{ user.fullName }}</strong>
        <small>{{ roleLabel() }}</small>
      </div>
    }
  </div>
</aside>
